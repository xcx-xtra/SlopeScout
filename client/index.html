<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/retro-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlopeScout - Discover Epic Skate Spots</title>
    <meta
      name="description"
      content="Find and share the best skateboarding spots with SlopeScout's retro-inspired platform"
    />

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical font loading with font-display: swap for performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Condensed:wght@300;400;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#ff6b35" />

    <!-- Accessibility: Skip to main content -->
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 6px;
        background: #ff6b35;
        color: #1a1a1a;
        padding: 8px;
        z-index: 1000;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
      }
      .skip-link:focus {
        top: 6px;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
